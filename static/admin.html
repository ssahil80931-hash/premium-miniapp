<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Cyber Admin Control</title>
    <style>
        :root { --spidey-red: #ff0055; --spidey-blue: #00d2ff; --bg: #05060a; --card: #0d111a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', monospace; }
        body { background: var(--bg); color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; }

        #spiderCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 14px 22px; border-radius: 10px; font-weight: bold; letter-spacing: 1px; backdrop-filter: blur(10px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: translateY(-100px); opacity: 0; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .toast.show { transform: translateY(0); opacity: 1; }

        .login-wrap { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: rgba(13, 17, 26, 0.9); border: 2px solid var(--spidey-red); border-radius: 20px; padding: 35px 25px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 0 35px rgba(255, 0, 85, 0.4); backdrop-filter: blur(10px); }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: var(--spidey-blue); margin-bottom: 6px; font-weight: bold; }
        .input-group input { width: 100%; padding: 14px; background: #05070f; border: 1px solid #1a233a; border-radius: 10px; color: #fff; outline: none; }

        .spidey-btn { background: linear-gradient(45deg, var(--spidey-red), #b3003b); color: #fff; font-weight: 800; border: none; padding: 14px; width: 100%; border-radius: 10px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; transition: 0.2s; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
        .spidey-btn:hover { transform: scale(1.02); }

        .dash-wrap { position: relative; z-index: 10; max-width: 1000px; margin: 0 auto; padding: 20px; display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid var(--spidey-red); padding-bottom: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card); border: 1px solid #1f293d; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-val { font-size: 28px; font-weight: 800; color: var(--spidey-blue); margin-top: 5px; }
        
        .card { background: var(--card); border: 1px solid #1f293d; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        h3 { color: #fff; margin-bottom: 15px; border-bottom: 1px solid #1f293d; padding-bottom: 8px; }
        
        input, textarea { width: 100%; padding: 12px; background: #05070f; border: 1px solid #1f293d; border-radius: 8px; color: #fff; margin-bottom: 12px; outline: none; }
        .row { display: flex; gap: 15px; } .col { flex: 1; }
        
        .btn-approve { background: #00ff9d; color: #000; padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reject { background: #ff4757; color: #fff; padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: var(--spidey-blue); color: #000; padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        .btn-delete { background: #ff4757; color: #fff; padding: 6px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .item-row { background: #05070f; border: 1px solid #1f293d; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <canvas id="spiderCanvas"></canvas>

    <div id="toastBox" class="toast"></div>

    <div id="loginSection" class="login-wrap">
        <div class="login-card">
            <div style="font-size:45px;">🕷️</div>
            <h2>SPIDEY ADMIN LOGIN</h2>
            <div class="input-group">
                <label>USERNAME</label>
                <input type="text" id="admin_user_input" placeholder="Admin Username">
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="admin_pass_input" placeholder="Password">
            </div>
            <button class="spidey-btn" onclick="attemptLogin()">AUTHENTICATE</button>
        </div>
    </div>

    <div id="dashSection" class="dash-wrap">
        <div class="header">
            <h1 style="color:var(--spidey-red); text-shadow: 0 0 10px var(--spidey-red);">🕷️ SPIDEY MASTER PANEL</h1>
            <button class="spidey-btn" style="width:auto; padding:8px 15px; background:var(--spidey-blue);" onclick="logout()">LOGOUT</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div>TOTAL REVENUE</div>
                <div class="stat-val" id="total_revenue">₹0</div>
            </div>
            <div class="stat-card">
                <div>TOTAL CUSTOMERS</div>
                <div class="stat-val" id="total_users">0</div>
            </div>
            <div class="stat-card">
                <div>PENDING PROOFS</div>
                <div class="stat-val" id="pending_count" style="color:var(--spidey-red);">0</div>
            </div>
        </div>

        <div class="card">
            <h3>💳 Payment Approvals & Link Release</h3>
            <div id="pending_orders_list">Loading...</div>
        </div>

        <div class="card">
            <h3 id="formTitle">🛍️ Add / Edit Product</h3>
            <input type="hidden" id="p_id">
            <input type="text" id="p_title" placeholder="Product Title">
            <textarea id="p_desc" placeholder="Description"></textarea>
            <div class="row">
                <div class="col"><input type="text" id="p_price" placeholder="Price (₹)"></div>
                <div class="col"><input type="text" id="p_btn" placeholder="Button Text (e.g. BUY ACCESS)"></div>
            </div>
            <input type="text" id="p_video" placeholder="Direct Video URL (.mp4 file link)">
            <input type="text" id="p_link" placeholder="Private Telegram Group / Access Link">
            <div style="display:flex; gap:10px;">
                <button class="spidey-btn" style="flex:2;" onclick="saveProduct()">SAVE / UPDATE PRODUCT</button>
                <button class="spidey-btn" style="flex:1; background:#444;" onclick="resetProductForm()">RESET FORM</button>
            </div>
        </div>

        <div class="card">
            <h3>📦 Existing Products (Edit / Delete)</h3>
            <div id="existing_products_list">Loading products...</div>
        </div>

        <div class="card">
            <h3>⚙️ Credentials & Store Settings</h3>
            <div class="row">
                <div class="col"><input type="text" id="adm_user" placeholder="Admin Username"></div>
                <div class="col"><input type="text" id="adm_pass" placeholder="Admin Password"></div>
            </div>
            <div class="row">
                <div class="col"><input type="text" id="upi_id" placeholder="UPI ID"></div>
                <div class="col"><input type="text" id="qr_image" placeholder="QR Direct Link"></div>
            </div>
            <textarea id="payment_note" placeholder="Description / Note below QR code (e.g., Scan & Pay via any UPI App, enter UTR)"></textarea>
            <div class="row">
                <div class="col"><input type="color" id="theme_color" value="#00ff9d" style="height:45px;"></div>
                <div class="col"><button class="spidey-btn" onclick="saveSettings()" style="margin-top:2px;">UPDATE CREDENTIALS & CONFIG</button></div>
            </div>
        </div>
    </div>

    <script>
        function showToast(msg, isError = false) {
            const t = document.getElementById('toastBox');
            t.style.background = isError ? 'rgba(255, 71, 87, 0.95)' : 'rgba(0, 255, 157, 0.95)';
            t.style.color = isError ? '#fff' : '#000';
            t.style.border = isError ? '1px solid #ff4757' : '1px solid #00ff9d';
            t.innerText = (isError ? '⚠️ ' : '⚡ ') + msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        const canvas = document.getElementById('spiderCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let nodes = Array.from({length: 40}, () => ({
            x: Math.random() * canvas.width, y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
            color: Math.random() > 0.5 ? '#ff0055' : '#00d2ff'
        }));

        function drawSpiderWeb() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            nodes.forEach((n, i) => {
                n.x += n.vx; n.y += n.vy;
                if(n.x<0 || n.x>canvas.width) n.vx*=-1;
                if(n.y<0 || n.y>canvas.height) n.vy*=-1;
                ctx.beginPath(); ctx.arc(n.x, n.y, 2.5, 0, Math.PI*2); ctx.fillStyle = n.color; ctx.fill();
                for(let j=i+1; j<nodes.length; j++){
                    let n2 = nodes[j]; let dist = Math.hypot(n.x-n2.x, n.y-n2.y);
                    if(dist < 120){ ctx.lineWidth = 1 - dist/120; ctx.strokeStyle = n.color; ctx.beginPath(); ctx.moveTo(n.x, n.y); ctx.lineTo(n2.x, n2.y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(drawSpiderWeb);
        }
        drawSpiderWeb();

        let cachedProducts = [];

        async function attemptLogin() {
            const u = document.getElementById('admin_user_input').value;
            const p = document.getElementById('admin_pass_input').value;
            const res = await fetch('/api/admin/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p}) });
            const data = await res.json();
            if(data.status === 'success') {
                localStorage.setItem('spidey_token', data.token);
                showToast('Authenticated Successfully!');
                showDashboard();
            } else {
                showToast('Invalid Username or Password!', true);
            }
        }

        function checkAuth() { if(localStorage.getItem('spidey_token')) showDashboard(); }
        function logout() { localStorage.removeItem('spidey_token'); location.reload(); }

        async function showDashboard() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashSection').style.display = 'block';
            
            const res = await fetch('/api/admin/dashboard');
            const data = await res.json();
            
            document.getElementById('total_revenue').innerText = '₹' + data.revenue;
            document.getElementById('total_users').innerText = data.total_users;
            document.getElementById('pending_count').innerText = data.pending_orders.length;
            document.getElementById('adm_user').value = data.admin_user;
            document.getElementById('adm_pass').value = data.admin_pass;
            document.getElementById('payment_note').value = data.payment_note || "";

            const pendingList = document.getElementById('pending_orders_list');
            pendingList.innerHTML = data.pending_orders.length === 0 ? '<div style="color:#777;">No pending payment approvals.</div>' : '';
            data.pending_orders.forEach(o => {
                pendingList.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>${o.user_name}</strong> (ID: ${o.user_id})<br>
                            <small>Item: ${o.title} | ₹${o.price}</small><br>
                            <small style="color:var(--spidey-blue);">UTR: <b>${o.utr}</b></small>
                        </div>
                        <div>
                            <button class="btn-approve" onclick="approveOrder(${o.id})">APPROVE</button>
                            <button class="btn-reject" onclick="rejectOrder(${o.id})">REJECT</button>
                        </div>
                    </div>`;
            });

            cachedProducts = data.products;
            renderProductsList();

            const cfgRes = await fetch('/api/data');
            const cfgData = await cfgRes.json();
            document.getElementById('upi_id').value = cfgData.config.upi_id;
            document.getElementById('qr_image').value = cfgData.config.qr_image;
            document.getElementById('theme_color').value = cfgData.config.theme_color;
        }

        function renderProductsList() {
            const prodList = document.getElementById('existing_products_list');
            prodList.innerHTML = cachedProducts.length === 0 ? '<div style="color:#777;">No products created yet.</div>' : '';
            cachedProducts.forEach(p => {
                prodList.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>${p.title}</strong> - <span style="color:var(--spidey-blue);">₹${p.price}</span><br>
                            <small style="color:#aaa;">Button: "${p.btn_text}" | Group Link: ${p.group_link ? 'Set' : 'Not Set'}</small>
                        </div>
                        <div>
                            <button class="btn-edit" onclick="editProduct(${p.id})">✏️ EDIT</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">🗑️ DELETE</button>
                        </div>
                    </div>`;
            });
        }

        function editProduct(id) {
            const p = cachedProducts.find(x => x.id === id);
            if(!p) return;
            document.getElementById('p_id').value = p.id;
            document.getElementById('p_title').value = p.title;
            document.getElementById('p_desc').value = p.description;
            document.getElementById('p_price').value = p.price;
            document.getElementById('p_btn').value = p.btn_text;
            document.getElementById('p_video').value = p.video_url;
            document.getElementById('p_link').value = p.group_link;
            document.getElementById('formTitle').innerText = '✏️ Edit Product (ID: ' + p.id + ')';
            window.scrollTo({ top: document.getElementById('formTitle').offsetTop - 20, behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('p_id').value = '';
            document.getElementById('p_title').value = '';
            document.getElementById('p_desc').value = '';
            document.getElementById('p_price').value = '';
            document.getElementById('p_btn').value = '';
            document.getElementById('p_video').value = '';
            document.getElementById('p_link').value = '';
            document.getElementById('formTitle').innerText = '🛍️ Add New Product';
        }

        async function saveProduct() {
            const pId = document.getElementById('p_id').value;
            const p = {
                id: pId ? parseInt(pId) : null,
                title: document.getElementById('p_title').value,
                description: document.getElementById('p_desc').value,
                price: document.getElementById('p_price').value,
                btn_text: document.getElementById('p_btn').value,
                video_url: document.getElementById('p_video').value,
                group_link: document.getElementById('p_link').value
            };
            if(!p.title || !p.price) return showToast('Title and Price are required!', true);

            await fetch('/api/admin/save-product', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p) });
            showToast(pId ? 'Product Updated Successfully!' : 'New Product Published!');
            resetProductForm();
            showDashboard();
        }

        async function deleteProduct(id) {
            if(!confirm('Are you sure you want to delete this product?')) return;
            await fetch('/api/admin/delete-product', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: id}) });
            showToast('Product Deleted!');
            showDashboard();
        }

        async function approveOrder(id) {
            await fetch('/api/admin/approve-order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_id: id}) });
            showToast('Order Approved!');
            showDashboard();
        }

        async function rejectOrder(id) {
            await fetch('/api/admin/reject-order', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({order_id: id}) });
            showToast('Order Rejected!', true);
            showDashboard();
        }

        async function saveSettings() {
            const s = {
                upi_id: document.getElementById('upi_id').value,
                qr_image: document.getElementById('qr_image').value,
                theme_color: document.getElementById('theme_color').value,
                enable_animation: true,
                admin_user: document.getElementById('adm_user').value,
                admin_pass: document.getElementById('adm_pass').value,
                payment_note: document.getElementById('payment_note').value
            };
            await fetch('/api/admin/update-settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(s) });
            showToast('Settings Updated!');
        }

        checkAuth();
    </script>
</body>
</html>
