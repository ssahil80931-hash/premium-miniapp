<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 15px; margin: 0; }
        .product-card { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
        h3 { margin-top: 0; color: #38bdf8; }
        button { background: #00ff9d; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 8px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 10px; max-width: 400px; margin: 50px auto; border: 1px solid #334155; }
    </style>
</head>
<body>
    <h2>Digital Store</h2>
    <div id="products-container">Loading products...</div>

    <!-- Payment Modal -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3>Complete Payment</h3>
            <p id="payNote"></p>
            <p>UPI ID: <b id="upiIdDisplay"></b></p>
            <p>Amount: ₹<b id="amountDisplay"></b></p>
            <input type="text" id="utrInput" placeholder="Enter 12-digit UTR Number">
            <button onclick="submitOrder()">Submit UTR & Verify</button>
            <button onclick="closeModal()" style="background: #ef4444; color: #fff; margin-top: 5px;">Cancel</button>
        </div>
    </div>

    <script>
        let storeConfig = {};
        let selectedProductId = null;

        fetch('/api/data')
            .then(res => res.json())
            .then(data => {
                storeConfig = data.config;
                const container = document.getElementById('products-container');
                container.innerHTML = '';
                
                if (!data.products || data.products.length === 0) {
                    container.innerHTML = '<p>No products available right now.</p>';
                    return;
                }

                data.products.forEach(prod => {
                    const btnText = prod.btn_text || 'Buy Now';
                    container.innerHTML += `
                        <div class="product-card">
                            <h3>${prod.title}</h3>
                            <p>${prod.description}</p>
                            <p><b>Price: ₹${prod.price}</b></p>
                            <button onclick="openModal(${prod.id}, '${prod.price}')">${btnText}</button>
                        </div>
                    `;
                });
            });

        function openModal(productId, price) {
            selectedProductId = productId;
            document.getElementById('amountDisplayinnerText = price;
            document.getElementById('upiIdDisplay').innerText = storeConfig.upi_id;
            document.getElementById('payNote').innerText = storeConfig.payment_note;
            document.getElementById('payModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('utrInput').value = '';
        }

        function submitOrder() {
            const utr = document.getElementById('utrInput').value.trim();
            if(!utr) {
                alert('Please enter UTR number');
                return;
            }

            // Telegram WebApp user mapping (Fallback to test user if outside telegram)
            const tg = window.Telegram?.WebApp;
            const userId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "test_user_123";
            const userName = tg?.initDataUnsafe?.user?.first_name || "Test User";

            fetch('/api/order/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    user_name: userName,
                    product_id: selectedProductId,
                    utr_proof: utr
                })
            })
            .then(res => res.json())
            .then(response => {
                if(response.status === 'success') {
                    alert('Order placed successfully! Status: ' + response.order_status);
                    closeModal();
                } else {
                    alert('Error: ' + response.message);
                }
            });
        }
    </script>
</body>
</html>
