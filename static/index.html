<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Video Vault</title>
    <style>
        body { background: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; text-align: center; }
        .vault-box {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px; border-radius: 20px; position: relative; overflow: hidden; margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        /* Top Animated Light Line */
        .vault-box::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #00ffcc, transparent);
            animation: moveLine 3s linear infinite;
        }
        @keyframes moveLine { 100% { left: 100%; } }
        .product-card { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .btn { background: linear-gradient(135deg, #00ffcc, #00b386); color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="vault-box">
        <h2 style="margin:5px 0;">🔥 VIP VIDEO VAULT</h2>
        <p style="color: #aaa; font-size: 13px;">Watch Preview & Get Instant Access</p>
    </div>

    <div id="store-container">Loading products...</div>

    <script>
        fetch('/api/data').then(res => res.json()).then(data => {
            let html = '';
            data.products.forEach(p => {
                html += `
                    <div class="vault-box product-card">
                        <h3>${p.title}</h3>
                        <p style="color:#ccc; font-size:14px;">${p.description}</p>
                        <h4 style="color:#00ffcc;">₹${p.price}</h4>
                        <input type="text" id="name_${p.id}" placeholder="Your Telegram Name">
                        <input type="text" id="utr_${p.id}" placeholder="Enter 12-digit UTR / UPI Ref">
                        <button class="btn" onclick="submitOrder(${p.id}, '${p.price}')">Get Access Now</button>
                    </div>
                `;
            });
            document.getElementById('store-container').innerHTML = html;
        });

        function submitOrder(productId, price) {
            let name = document.getElementById(`name_${productId}`).value;
            let utr = document.getElementById(`utr_${productId}`).value;
            if(!utr || !name) { alert('Please enter name and UTR!'); return; }

            fetch('/api/order/submit', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({product_id: productId, name: name, utr: utr, price: price})
            }).then(res => res.json()).then(data => {
                alert('Order submitted! Verification pending. Admin will approve shortly.');
            });
        }
    </script>
</body>
</html>
