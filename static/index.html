<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f121d;
            color: #ffffff;
            padding-bottom: 70px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 18px;
            background: #0f121d;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .store-logo {
            font-size: 20px;
            font-weight: 900;
            color: #f5b027;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .profile-icon {
            width: 34px;
            height: 34px;
            background: #1a2238;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4c82f7;
        }

        /* Store Feed */
        .container { padding: 12px 16px; }

        .product-card {
            background: #141927;
            border-radius: 16px;
            border: 1px solid #1e2638;
            padding: 14px;
            margin-bottom: 16px;
        }

        /* Video Thumbnail Grid Layout */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        .media-item {
            position: relative;
            aspect-ratio: 4/3;
            background: #252d42;
            overflow: hidden;
        }
        .media-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .duration-tag {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Card Badges */
        .badge-top-left {
            position: absolute;
            top: 8px; left: 8px;
            background: #f5b027;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            z-index: 2;
        }
        .badge-top-right {
            position: absolute;
            top: 8px; right: 8px;
            background: #ff5252;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            z-index: 2;
        }
        .badge-bottom-left {
            position: absolute;
            bottom: 8px; left: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: #27e39f;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        /* Product Details */
        .product-info { margin-top: 14px; }
        .product-title {
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .product-desc {
            font-size: 12px;
            color: #7b88a8;
            margin-top: 3px;
        }

        /* Action Row */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .price-box { display: flex; flex-direction: column; }
        .price { font-size: 20px; font-weight: 800; color: #fff; }
        .sales { font-size: 11px; color: #f5b027; display: flex; align-items: center; gap: 4px; }

        .buy-btn {
            background: #f5b027;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        /* Floating Admin Button */
        .floating-btn {
            position: fixed;
            bottom: 75px; right: 16px;
            background: #0088cc;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            z-index: 99;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            height: 60px;
            background: #141927;
            border-top: 1px solid #1e2638;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #5d6c8e;
            font-size: 10px;
            gap: 4px;
            cursor: pointer;
        }
        .nav-item.active { color: #f5b027; }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="store-logo">✦ STORE NAME</div>
        <div class="profile-icon"><i class="fa-solid fa-user"></i></div>
    </div>

    <!-- Main Content -->
    <div class="container">

        <!-- Product Card 1 -->
        <div class="product-card">
            <div style="position: relative;">
                <div class="badge-top-left">✦ PREMIUM</div>
                <div class="badge-top-right">🔥 HOT</div>
                
                <div class="media-grid">
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+1">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 4:24</div>
                    </div>
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+2">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 16:52</div>
                    </div>
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+3">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 51:05</div>
                    </div>
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+4">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 37:36</div>
                    </div>
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+5">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 22:06</div>
                    </div>
                    <div class="media-item">
                        <img src="https://via.placeholder.com/150/1a2238/ffffff?text=Video+6">
                        <div class="duration-tag"><i class="fa-solid fa-play"></i> 10:41</div>
                    </div>
                </div>
            </div>

            <div class="product-info">
                <div class="product-title">Python Automation Masterclass</div>
                <div class="product-desc">Full video course with source codes</div>
            </div>

            <div class="action-row">
                <div class="price-box">
                    <div class="price">₹149</div>
                    <div class="sales">★ 1000+ sold</div>
                </div>
                <button class="buy-btn" onclick="buyProduct('Python Automation Masterclass', 149)">Buy Now</button>
            </div>
        </div>

    </div>

    <!-- Floating Telegram Admin Button -->
    <a href="https://t.me/YOUR_ADMIN_USERNAME" class="floating-btn" target="_blank">
        <i class="fa-paper-plane"></i> Contact Admin
    </a>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-star"></i>
            <span>Reviews</span>
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function buyProduct(title, price) {
            tg.HapticFeedback.impactOccurred("medium");
            
            // Telegram bot ko data bheje
            const order = {
                product: title,
                price: price
            };
            tg.sendData(JSON.stringify(order));
        }
    </script>
</body>
</html>
