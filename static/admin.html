<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Dashboard</title>
    <style>
        :root {
            --bg-body: #080b11;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
        }

        /* Login Screen */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #051911;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Dashboard Styles */
        #dashboard-screen {
            display: none;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
        }

        /* Sections / Cards */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .section-header {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tables & Lists */
        .item-row {
            background: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-info div:first-child {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .item-info div:last-child {
            font-size: 11px;
            color: var(--text-muted);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-approve { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .btn-reject { background: rgba(239, 68, 68, 0.15); color: #ef4444; }

        .form-row {
            margin-bottom: 12px;
        }

        .form-row label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Login Screen -->
        <div id="login-screen">
            <div class="login-card">
                <div class="login-title">🔒 Admin Portal</div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" class="input-field" placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" class="input-field" placeholder="Enter password">
                </div>
                <button class="btn" onclick="handleLogin()">LOGIN</button>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboard-screen">
            <div class="header-flex">
                <div class="header-title">⚡ Master Admin Panel</div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value" id="statRevenue">₹0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Customers</div>
                    <div class="stat-value" id="statCustomers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending Proofs</div>
                    <div class="stat-value" id="statPending" style="color: #f59e0b;">0</div>
                </div>
            </div>

            <!-- Pending Orders / Approvals -->
            <div class="section-card">
                <div class="section-header">💳 Pending UTR Approvals</div>
                <div id="ordersContainer">
                    <div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">No pending proofs</div>
                </div>
            </div>

            <!-- Products Management -->
            <div class="section-card">
                <div class="section-header">📦 Manage Products / Courses</div>
                <div id="productsContainer">
                    <div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">Loading products...</div>
                </div>
            </div>

            <!-- Settings / UPI Config -->
            <div class="section-card">
                <div class="section-header">⚙️ Payment Settings & UPI</div>
                <div class="form-row">
                    <label>UPI ID</label>
                    <input type="text" id="settingUpi" class="input-field">
                </div>
                <div class="form-row">
                    <label>Payment Note / Instructions</label>
                    <input type="text" id="settingNote" class="input-field">
                </div>
                <button class="btn" style="margin-top: 8px; padding: 10px;" onclick="saveSettings()">SAVE SETTINGS</button>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();

            try {
                let res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                let data = await res.json();
                if (data.status === 'success') {
                    localStorage.setItem('admin_logged', 'true');
                    loadDashboard();
                } else {
                    alert('Invalid Username or Password');
                }
            } catch (err) {
                alert('Login failed');
            }
        }

        function logout() {
            localStorage.removeItem('admin_logged');
            document.getElementById('dashboard-screen').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        async function loadDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard-screen').style.display = 'block';

            try {
                let res = await fetch('/api/admin/dashboard');
                let data = await res.json();

                document.getElementById('statRevenue').innerText = `₹${data.revenue}`;
                document.getElementById('statCustomers').innerText = data.total_buyers || 0;
                
                let pendingOrders = data.orders.filter(o => o.status === 'pending');
                document.getElementById('statPending').innerText = pendingOrders.length;

                // Render Orders
                let ordersHtml = '';
                if (!pendingOrders.length) {
                    ordersHtml = '<div style="color: var(--text-muted); font-size: 12px; text-align: center; padding: 10px;">No pending proofs</div>';
                } else {
                    pendingOrders.forEach(o => {
                        ordersHtml += `
                            <div class="item-row">
                                <div class="item-info">
                                    <div>${o.user_name} (${o.title})</div>
                                    <div>UTR: <b>${o.utr}</b> | ₹${o.price}</div>
                                </div>
                                <div class="action-btns">
                                    <button class="btn-sm btn-approve" onclick="approveOrder(${o.id})">Approve</button>
                                    <button class="btn-sm btn-reject" onclick="rejectOrder(${o.id})">Reject</button>
                                </div>
                            </div>
                        `;
                    });
                }
                document.getElementById('ordersContainer').innerText = '';
                document.getElementById('ordersContainer').innerHTML = ordersHtml;

                // Render Products
                let prodHtml = '';
                data.products.forEach(p => {
                    prodHtml += `
                        <div class="item-row">
                            <div class="item-info">
                                <div>${p.title}</div>
                                <div>₹${p.price} | Access: ${p.day_access}</div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('productsContainer').innerHTML = prodHtml;

                // Load Settings
                document.getElementById('settingUpi').value = data.upi_id || '';
                document.getElementById('settingNote').value = data.payment_note || '';

            } catch (err) {
                console.error(err);
            }
        }

        async function approveOrder(id) {
            await fetch('/api/admin/approve-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({order_id: id})
            });
            loadDashboard();
        }

        async function rejectOrder(id) {
            await fetch('/api/admin/reject-order', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({order_id: id})
            });
            loadDashboard();
        }

        async function saveSettings() {
            let upi = document.getElementById('settingUpi').value;
            let note = document.getElementById('settingNote').value;

            await fetch('/api/admin/update-settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    upi_id: upi,
                    payment_note: note,
                    admin_user: 'admin',
                    admin_pass: 'admin123'
                })
            });
            alert('Settings saved successfully!');
            loadDashboard();
        }

        // Auto login check
        if (localStorage.getItem('admin_logged') === 'true') {
            loadDashboard();
        }
    </script>
</body>
</html>
