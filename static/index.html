<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Video Vault</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #05070b;
            --bg-card: #0e131f;
            --accent: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            /* Jelly Elastic Smooth Momentum Scrolling */
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding: 16px;
            padding-bottom: 60px;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .logo-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* Clean Modern Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card:active {
            transform: scale(0.98); /* Jelly touch squeeze */
        }

        /* Video Box */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 210px;
            background: #000;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Automatic Text Overlay on Video */
        .video-overlay-text {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .card-body {
            padding: 16px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
        }

        .badge-tag {
            font-size: 11px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: #05070b;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--accent-glow);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Modal Sheet */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: #0e131f;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 440px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 18px;
            cursor: pointer;
        }

        .input-field {
            width: 100%;
            background: #05070b;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent);
        }

        .upi-box {
            background: rgba(0, 255, 136, 0.05);
            border: 1px dashed var(--accent);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 14px;
        }

        .loading, .error-state {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-icon">🔥</div>
            <h1>VIP VIDEO VAULT</h1>
            <p class="subtitle">Watch Demo Preview & Get Instant Access</p>
        </div>

        <div id="store-container">
            <div class="loading">Loading videos...</div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">
                <span id="modalProdTitle">Complete Payment</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="upi-box">
                <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">Pay to UPI ID:</div>
                <strong id="displayUpi" style="color: var(--accent); font-size: 15px; user-select: all;">loading...</strong>
            </div>
            <p id="paymentNote" class="product-desc" style="font-size: 11px; text-align: center; margin-bottom: 14px;"></p>
            
            <div style="margin-bottom: 14px;">
                <label style="font-size: 11px; color: var(--text-sub); display: block; margin-bottom: 6px;">Enter 12-Digit UTR / Transaction ID:</label>
                <input type="text" id="utrInput" class="input-field" placeholder="e.g. 4352xxxxxxxx">
            </div>

            <button class="btn" onclick="submitOrder()">VERIFY & SUBMIT PAYMENT</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div style="font-size: 36px; margin-bottom: 10px;">🎉</div>
            <h2 style="color: #fff; font-size: 18px; margin-bottom: 6px;">Payment Under Review</h2>
            <p class="product-desc" style="margin-bottom: 20px;">Admin will verify your UTR shortly. Your private group link will unlock automatically right here!</p>
            <button class="btn" onclick="closeModal()">OKAY</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentProductId = null;
        let globalConfig = {};
        let productsData = [];

        async function fetchStoreData() {
            try {
                let res = await fetch('/api/data');
                let data = await res.json();
                productsData = data.products;
                globalConfig = data.config;
                renderStore();
                checkUserExistingStatus();
            } catch (err) {
                document.getElementById('store-container').innerHTML = '<div class="error-state">Failed to load store. Please refresh.</div>';
            }
        }

        function renderStore() {
            let container = document.getElementById('store-container');
            if (!productsData.length) {
                container.innerHTML = '<div class="error-state">No videos available right now.</div>';
                return;
            }

            let html = '';
            productsData.forEach(p => {
                let videoHtml = p.video_url ? `
                    <div class="video-wrapper">
                        <video src="${p.video_url}" autoplay muted loop playsinline></video>
                        <div class="video-overlay-text">Want full video? Get Access below 🚀</div>
                    </div>
                ` : `
                    <div class="video-wrapper" style="display:flex; align-items:center; justify-content:center; background:#080b11; color:#9ca3af; font-size:12px;">
                        <span>🎬 Video Preview</span>
                        <div class="video-overlay-text">Want full video? Get Access below 🚀</div>
                    </div>
                `;

                html += `
                    <div class="card">
                        ${videoHtml}
                        <div class="card-body">
                            <div class="product-title">${p.title}</div>
                            <div class="product-desc">${p.description || ''}</div>
                            <div class="price-row">
                                <span class="product-price">₹${p.price}</span>
                                <span class="badge-tag">⏳ ${p.day_access || 'Lifetime'}</span>
                            </div>
                            <button class="btn" onclick="openCheckout(${p.id})">${p.btn_text || 'GET INSTANT ACCESS 🚀'}</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openCheckout(productId) {
            currentProductId = productId;
            let prod = productsData.find(x => x.id === productId);
            if (!prod) return;

            document.getElementById('modalProdTitle').innerText = prod.title;
            document.getElementById('displayUpi').innerText = globalConfig.upi_id || '';
            document.getElementById('paymentNote').innerText = globalConfig.payment_note || '';
            document.getElementById('payModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('successModal').style.display = 'none';
        }

        async function submitOrder() {
            let utr = document.getElementById('utrInput').value.trim();
            if (!utr || utr.length < 6) {
                alert('Please enter a valid UTR / Transaction ID');
                return;
            }

            let userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_' + Math.floor(Math.random()*1000);
            let userName = tg.initDataUnsafe?.user?.first_name || 'VIP Member';

            try {
                let res = await fetch('/api/order/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: userName,
                        product_id: currentProductId,
                        utr_proof: utr
                    })
                });
                let data = await res.json();
                if (data.status === 'success') {
                    closeModal();
                    document.getElementById('successModal').style.display = 'flex';
                }
            } catch (err) {
                alert('Error submitting order. Try again.');
            }
        }

        async function checkUserExistingStatus() {
            let userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
            if (!userId) return;

            try {
                let res = await fetch(`/api/order/check-status?user_id=${userId}`);
                let data = await res.json();
                if (data.status === 'approved' && data.group_link) {
                    document.getElementById('store-container').innerHTML = `
                        <div class="card" style="text-align: center; padding: 30px;">
                            <div style="font-size: 40px; margin-bottom: 10px;">👑</div>
                            <h2 style="color: #fff; font-size: 18px; margin-bottom: 6px;">VIP Access Unlocked!</h2>
                            <p class="product-desc" style="margin-bottom: 20px;">Your payment has been verified. Join the private channel below:</p>
                            <a href="${data.group_link}" target="_blank" class="btn">JOIN VIP CHANNEL NOW 🚀</a>
                        </div>
                    `;
                }
            } catch (e) {}
        }

        fetchStoreData();
    </script>
</body>
</html>
