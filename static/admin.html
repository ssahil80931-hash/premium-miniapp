<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0b0e14; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #00ff9d; margin-bottom: 20px; text-shadow: 0 0 10px rgba(0, 255, 157, 0.3); }
        .card { background: #161b26; border: 1px solid #242c3d; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
        h3 { color: #fff; margin-bottom: 15px; border-bottom: 1px solid #242c3d; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #8b9bb4; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #242c3d; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #00ff9d; box-shadow: 0 0 8px rgba(0, 255, 157, 0.2); }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { background: #00ff9d; color: #05080e; font-weight: 700; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: #00e08b; box-shadow: 0 0 15px rgba(0,255,157,0.4); }
        .btn-delete { background: #ff4757; color: white; margin-top: 10px; }
        .btn-delete:hover { background: #ff6b81; box-shadow: 0 0 15px rgba(255,71,87,0.4); }
        .product-item { background: #0b0e14; border: 1px solid #242c3d; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 10px; }
        .checkbox-container input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Store Management Panel</h1>

        <!-- GLOBAL CONFIGURATION -->
        <div class="card">
            <h3>⚙️ Global Settings & UI Appearance</h3>
            <div class="row">
                <div class="col form-group">
                    <label>UPI ID (Payment)</label>
                    <input type="text" id="upi_id" placeholder="e.g. user@upi">
                </div>
                <div class="col form-group">
                    <label>QR Image Direct Link</label>
                    <input type="text" id="qr_image" placeholder="https://image-url.com/qr.png">
                </div>
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>Theme Highlight Color</label>
                    <input type="color" id="theme_color" value="#00ff9d" style="height:45px;">
                </div>
                <div class="col form-group">
                    <label>Animations</label>
                    <div class="checkbox-container">
                        <input type="checkbox" id="enable_animation" checked>
                        <span>Enable Card Glow & Pulse Animations</span>
                    </div>
                </div>
            </div>
            <button onclick="saveSettings()">UPDATE GLOBAL SETTINGS</button>
        </div>

        <!-- ADD NEW PRODUCT -->
        <div class="card">
            <h3>🛍️ Add New Product listing</h3>
            <div class="form-group">
                <label>Product Title</label>
                <input type="text" id="p_title" placeholder="e.g. Premium VIP Pass">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="p_desc" rows="3" placeholder="Explain product highlights..."></textarea>
            </div>
            <div class="row">
                <div class="col form-group">
                    <label>Price (₹)</label>
                    <input type="text" id="p_price" placeholder="999">
                </div>
                <div class="col form-group">
                    <label>Button Text (Call To Action)</label>
                    <input type="text" id="p_btn" placeholder="Buy Now / Get Access">
                </div>
            </div>
            <div class="form-group">
                <label>Preview Video Direct Link (.mp4 URL)</label>
                <input type="text" id="p_video" placeholder="https://example.com/demo.mp4">
            </div>
            <button onclick="addProduct()">PUBLISH NEW PRODUCT</button>
        </div>

        <!-- MANAGE PRODUCTS LIST -->
        <div class="card">
            <h3>📦 Live Products List</h3>
            <div id="products_list">Loading products...</div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            const res = await fetch('/api/data');
            const data = await res.json();
            
            // Populate config
            document.getElementById('upi_id').value = data.config.upi_id;
            document.getElementById('qr_image').value = data.config.qr_image;
            document.getElementById('theme_color').value = data.config.theme_color;
            document.getElementById('enable_animation').checked = data.config.enable_animation;

            // Render live products
            const listDiv = document.getElementById('products_list');
            listDiv.innerHTML = '';
            
            data.products.forEach(p => {
                listDiv.innerHTML += `
                    <div class="product-item">
                        <div>
                            <strong>${p.title}</strong> - ₹${p.price}<br>
                            <small style="color:#8b9bb4;">Button: "${p.btn_text}" | Video: ${p.video_url.substring(0,30)}...</small>
                        </div>
                        <button class="btn-delete" style="width: auto; padding: 6px 12px;" onclick="deleteProduct(${p.id})">Delete</button>
                    </div>
                `;
            });
        }

        async function saveSettings() {
            const settings = {
                upi_id: document.getElementById('upi_id').value,
                qr_image: document.getElementById('qr_image').value,
                theme_color: document.getElementById('theme_color').value,
                enable_animation: document.getElementById('enable_animation').checked
            };
            await fetch('/api/admin/update-settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(settings)
            });
            alert('Settings Updated!');
            loadAdminData();
        }

        async function addProduct() {
            const product = {
                title: document.getElementById('p_title').value,
                description: document.getElementById('p_desc').value,
                price: document.getElementById('p_price').value,
                btn_text: document.getElementById('p_btn').value,
                video_url: document.getElementById('p_video').value
            };
            await fetch('/api/admin/save-product', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(product)
            });
            alert('Product Published!');
            loadAdminData();
        }

        async function deleteProduct(id) {
            if(!confirm('Are you sure you want to delete this product?')) return;
            await fetch('/api/admin/delete-product', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id})
            });
            loadAdminData();
        }

        loadAdminData();
    </script>
</body>
</html>
