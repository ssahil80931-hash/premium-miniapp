<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Store Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main-color: #00ff9d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #07090e; color: #fff; padding: 15px; }

        /* Animated Card Setup */
        .product-card { background: #121721; border-radius: 16px; border: 1px solid #1e2636; overflow: hidden; margin-bottom: 20px; transition: 0.3s; }
        .product-card.animated { animation: glowPulse 3s infinite alternate; }
        
        @keyframes glowPulse {
            0% { border-color: #1e2636; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
            100% { border-color: var(--main-color); box-shadow: 0 0 15px var(--main-color); }
        }

        video { width: 100%; height: 200px; object-fit: cover; background: #000; display: block; }
        .details { padding: 15px; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .desc { font-size: 13px; color: #9ab0c7; margin-bottom: 15px; line-height: 1.4; }
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .price { font-size: 20px; font-weight: 800; color: var(--main-color); }

        .buy-btn { background: var(--main-color); color: #000; font-weight: 800; border: none; padding: 12px; width: 100%; border-radius: 10px; cursor: pointer; font-size: 15px; text-transform: uppercase; }
        
        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #161b26; border-radius: 16px; padding: 20px; text-align: center; max-width: 320px; border: 1px solid var(--main-color); }
        .qr-img { width: 180px; height: 180px; border-radius: 10px; margin: 15px 0; border: 2px solid #fff; }
        .close-btn { background: #ff4757; color: white; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="store-list"></div>

    <!-- PAYMENT MODAL -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3>Complete Payment</h3>
            <img id="modalQr" class="qr-img" src="" alt="QR">
            <p style="font-size:14px;">Pay via UPI ID:</p>
            <strong id="modalUpi" style="color:var(--main-color); font-size:16px;"></strong>
            <button class="buy-btn close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        let currentConfig = {};

        async function loadStore() {
            const res = await fetch('/api/data');
            const data = await res.json();
            currentConfig = data.config;

            // Theme Color Set
            document.documentElement.style.setProperty('--main-color', currentConfig.theme_color);

            const storeList = document.getElementById('store-list');
            storeList.innerHTML = '';

            data.products.forEach(p => {
                const animClass = currentConfig.enable_animation ? 'animated' : '';
                storeList.innerHTML += `
                    <div class="product-card ${animClass}">
                        <video src="${p.video_url}" autoplay loop muted playsinline></video>
                        <div class="details">
                            <div class="title">${p.title}</div>
                            <div class="desc">${p.description}</div>
                            <div class="price-row">
                                <span class="price">₹${p.price}</span>
                            </div>
                            <button class="buy-btn" onclick="openPayment('${p.title}', '${p.price}')">${p.btn_text}</button>
                        </div>
                    </div>
                `;
            });
        }

        function openPayment(title, price) {
            document.getElementById('modalQr').src = currentConfig.qr_image;
            document.getElementById('modalUpi').innerText = currentConfig.upi_id;
            document.getElementById('payModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        loadStore();
    </script>
</body>
</html>
