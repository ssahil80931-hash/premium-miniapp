<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Club VIP Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #0b0710;
            --bg-card: rgba(25, 17, 36, 0.75);
            --accent-rose: #ff2a85;
            --accent-purple: #9d4edd;
            --text-main: #f3e8ff;
            --text-sub: #b8a9c9;
            --border-glow: rgba(255, 42, 133, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 0%, #24113c 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            min-height: 100vh;
            /* Jelly Elastic Smooth Momentum Scrolling */
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            padding: 16px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 440px;
            margin: 0 auto;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-rose), var(--accent-purple));
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.5);
            margin-bottom: 12px;
            font-size: 26px;
            animation: pulseJelly 3s infinite ease-in-out;
        }

        @keyframes pulseJelly {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 42, 133, 0.4); }
            50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(255, 42, 133, 0.7); }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ff70a6, #ff2a85, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* Jelly Card Effect on Touch */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
        }

        .card:active {
            transform: scale(0.97); /* Jelly squeeze feeling */
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            background: rgba(255, 42, 133, 0.15);
            color: #ff70a6;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 800;
            border: 1px solid rgba(255, 42, 133, 0.3);
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .badge-tag {
            display: inline-block;
            font-size: 11px;
            background: rgba(157, 78, 221, 0.2);
            color: #d8b4fe;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid rgba(157, 78, 221, 0.3);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--accent-rose), var(--accent-purple));
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.94); /* Bouncy Jelly Click */
        }

        /* Modal Sheet */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 3, 8, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
            animation: fadeInModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #150d22;
            border: 1px solid var(--border-glow);
            width: 100%;
            max-width: 440px;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--accent-rose);
        }

        .upi-box {
            background: rgba(255, 42, 133, 0.08);
            border: 1px dashed var(--accent-rose);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 14px;
            font-size: 14px;
        }

        .loading, .error-state {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo-badge">💋</div>
            <h1>VELVET CLUB</h1>
            <p class="subtitle">Exclusive VIP Private Passes & Community</p>
        </div>

        <div id="store-container">
            <div class="loading">Loading velvet experience...</div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">
                <span id="modalProdTitle">Complete Payment</span>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="upi-box">
                <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 4px;">Send payment to UPI ID:</div>
                <strong id="displayUpi" style="color: #ff70a6; font-size: 16px; user-select: all;">loading...</strong>
            </div>
            <p id="paymentNote" class="product-desc" style="font-size: 12px; text-align: center; margin-bottom: 14px;"></p>
            
            <div style="margin-bottom: 14px;">
                <label style="font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 6px;">Enter 12-Digit UTR / Transaction ID:</label>
                <input type="text" id="utrInput" class="input-field" placeholder="e.g. 4352xxxxxxxx">
            </div>

            <button class="btn" onclick="submitOrder()">VERIFY & SUBMIT PAYMENT</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content" style="text-align: center;">
            <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
            <h2 style="color: #fff; margin-bottom: 8px;">Payment Under Review</h2>
            <p class="product-desc" style="margin-bottom: 20px;">Admin will verify your UTR shortly. Once approved, your VIP Telegram link will unlock automatically right here!</p>
            <button class="btn" onclick="closeModal()">OKAY</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentProductId = null;
        let globalConfig = {};
        let productsData = [];

        async function fetchStoreData() {
            try {
                let res = await fetch('/api/data');
                let data = await res.json();
                productsData = data.products;
                globalConfig = data.config;
                renderStore();
                checkUserExistingStatus();
            } catch (err) {
                document.getElementById('store-container').innerHTML = '<div class="error-state">Failed to load store. Please refresh.</div>';
            }
        }

        function renderStore() {
            let container = document.getElementById('store-container');
            if (!productsData.length) {
                container.innerHTML = '<div class="error-state">No VIP passes available right now.</div>';
                return;
            }

            let html = '';
            productsData.forEach(p => {
                html += `
                    <div class="card">
                        <div class="product-title">
                            <span>${p.title}</span>
                            <span class="product-price">₹${p.price}</span>
                        </div>
                        <div class="badge-tag">⏳ Access: ${p.day_access || 'Lifetime'}</div>
                        <div class="product-desc">${p.description || ''}</div>
                        <button class="btn" onclick="openCheckout(${p.id})">${p.btn_text || 'UNLOCK ACCESS 💋'}</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openCheckout(productId) {
            currentProductId = productId;
            let prod = productsData.find(x => x.id === productId);
            if (!prod) return;

            document.getElementById('modalProdTitle').innerText = prod.title;
            document.getElementById('displayUpi').innerText = globalConfig.upi_id || 'clubmaza@upi';
            document.getElementById('paymentNote').innerText = globalConfig.payment_note || '';
            document.getElementById('payModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('successModal').style.display = 'none';
        }

        async function submitOrder() {
            let utr = document.getElementById('utrInput').value.trim();
            if (!utr || utr.length < 6) {
                alert('Please enter a valid UTR / Transaction ID');
                return;
            }

            let userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : 'test_user_' + Math.floor(Math.random()*1000);
            let userName = tg.initDataUnsafe?.user?.first_name || 'VIP Member';

            try {
                let res = await fetch('/api/order/submit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        user_id: userId,
                        user_name: userName,
                        product_id: currentProductId,
                        utr_proof: utr
                    })
                });
                let data = await res.json();
                if (data.status === 'success') {
                    closeModal();
                    document.getElementById('successModal').style.display = 'flex';
                }
            } catch (err) {
                alert('Error submitting order. Try again.');
            }
        }

        async function checkUserExistingStatus() {
            let userId = tg.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : null;
            if (!userId) return;

            try {
                let res = await fetch(`/api/order/check-status?user_id=${userId}`);
                let data = await res.json();
                if (data.status === 'approved' && data.group_link) {
                    document.getElementById('store-container').innerHTML = `
                        <div class="card" style="text-align: center; padding: 30px;">
                            <div style="font-size: 45px; margin-bottom: 12px;">👑</div>
                            <h2 style="color: #fff; margin-bottom: 8px;">VIP Access Unlocked!</h2>
                            <p class="product-desc" style="margin-bottom: 20px;">Your payment has been verified. Join the private velvet channel below:</p>
                            <a href="${data.group_link}" target="_blank" class="btn">JOIN VIP TELEGRAM CHANNEL 🚀</a>
                        </div>
                    `;
                }
            } catch (e) {}
        }

        fetchStoreData();
    </script>
</body>
</html>
