<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Group Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --card2: #1a1a25;
            --gold: #f5c542;
            --gold-glow: rgba(245, 197, 66, 0.35);
            --green: #00e676;
            --green-glow: rgba(0, 230, 118, 0.4);
            --text: #f0f0f5;
            --muted: #9a9ab0;
            --border: rgba(255,255,255,0.08);
            --danger: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(ellipse at 20% 20%, rgba(245,197,66,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(0,230,118,0.05) 0%, transparent 50%);
        }

        /* Animated border box */
        .glow-box {
            position: relative;
            background: var(--card);
            border-radius: 20px;
            overflow: hidden;
        }
        .glow-box::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, var(--gold), #ff6b6b, var(--green), #4facfe, var(--gold));
            background-size: 400% 400%;
            border-radius: 22px;
            z-index: -1;
            animation: borderGlow 6s ease infinite;
            opacity: 0.7;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            text-align: center;
            padding: 24px 16px 12px;
            position: relative;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--gold), #fff, var(--gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            letter-spacing: 1px;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
        .header p {
            color: var(--muted);
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .container {
            padding: 0 14px 40px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Product Card */
        .product-card {
            background: var(--card);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 50px rgba(245,197,66,0.15);
        }

        .media-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
            background: #000;
            pointer-events: none;
        }
        .media-wrap img, .media-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
            pointer-events: none;
        }
        .product-card:hover .media-wrap img {
            transform: scale(1.05);
        }
        .card-title, .card-desc, .meta-row, .overlay-lock, .tags, .lock-text {
            pointer-events: none;
        }
        .btn-access {
            pointer-events: auto !important;
        }

        .overlay-lock {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
        }
        .lock-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px var(--gold-glow);
            letter-spacing: 1px;
            animation: pulseText 2s ease-in-out infinite;
        }
        @keyframes pulseText {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }

        .tags {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag-premium {
            background: linear-gradient(135deg, #f5c542, #e6a800);
            color: #000;
        }
        .tag-vip {
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            color: #1a1a2e;
        }

        .card-body {
            padding: 16px 18px 20px;
        }
        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .card-desc {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.45;
            margin-bottom: 14px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--green);
            text-shadow: 0 0 15px var(--green-glow);
        }
        .validity {
            font-size: 0.8rem;
            color: var(--muted);
            background: rgba(255,255,255,0.06);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .btn-access {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 25px var(--green-glow);
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .btn-access::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: rgba(255,255,255,0.25);
            transform: rotate(25deg);
            transition: left 0.5s;
        }
        .btn-access:hover::after {
            left: 120%;
        }
        .btn-access:active {
            transform: scale(0.97);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.3s;
        }
        .modal-overlay.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: var(--card2);
            border-radius: 24px 24px 16px 16px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 20px;
            border: 1px solid var(--border);
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .modal h2 {
            font-size: 1.2rem;
            margin-bottom: 6px;
            text-align: center;
        }
        .modal .sub {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .qr-box {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .qr-box img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
        }

        .bill-info {
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 0.88rem;
        }
        .bill-info div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .bill-info div:last-child { margin-bottom: 0; }
        .bill-info .label { color: var(--muted); }

        .btn-pay {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2979ff, #00b0ff);
            color: #fff;
            margin-bottom: 14px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(41,121,255,0.35);
            transition: transform 0.2s;
        }
        .btn-pay:active { transform: scale(0.97); }

        .utr-section {
            margin-top: 8px;
        }
        .utr-section label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .utr-input {
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
        }
        .utr-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #e6a800);
            color: #000;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--gold-glow);
        }

        .success-box {
            text-align: center;
            padding: 20px 10px;
            display: none;
        }
        .success-box.show { display: block; }
        .success-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        .btn-group {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 6px 25px var(--green-glow);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        /* Bottom safe area */
        .safe-bottom { height: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="appName">Premium Group Hub</h1>
        <p>Exclusive Premium Access</p>
    </div>

    <div class="container" id="productList">
        <div class="loading">
            <div class="spinner"></div>
            Loading premium content...
        </div>
    </div>

    <div class="safe-bottom"></div>

    <!-- Payment Modal -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            
            <div id="paymentStep">
                <h2 id="modalTitle">Get Full Access</h2>
                <p class="sub" id="modalSub">Complete payment to unlock</p>

                <div class="qr-box">
                    <img id="qrImage" src="" alt="QR Code">
                </div>

                <div class="bill-info" id="billInfo">
                    <div><span class="label">Amount</span> <strong id="billAmount">₹0</strong></div>
                    <div><span class="label">UPI ID</span> <strong id="billUpi">—</strong></div>
                    <div><span class="label">Description</span> <strong id="billDesc">Premium Access</strong></div>
                </div>

                <button class="btn-pay" id="payOnlineBtn" onclick="openUPI()">
                    💳 Pay Online
                </button>

                <div class="utr-section">
                    <label>After payment, enter UTR / Transaction ID</label>
                    <input type="text" class="utr-input" id="utrInput" placeholder="Enter 12-digit UTR number" maxlength="22">
                    <button class="btn-submit" onclick="submitUTR()">Verify & Unlock</button>
                </div>
            </div>

            <div class="success-box" id="successStep">
                <div class="success-icon">🎉</div>
                <h2>Access Granted!</h2>
                <p class="sub" style="margin-bottom:16px;">Your premium access is ready</p>
                <a href="#" class="btn-group" id="groupLinkBtn" target="_blank">Join Premium Group</a>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor('#0a0a0f');
            tg.setBackgroundColor('#0a0a0f');
        }

        let currentProduct = null;
        let currentUpiLink = '';

        async function loadApp() {
            const container = document.getElementById('productList');
            try {
                // Settings
                const setRes = await fetch('/api/settings');
                if (!setRes.ok) throw new Error('Settings failed');
                const settings = await setRes.json();
                if (settings.mini_app_name) {
                    document.getElementById('appName').textContent = settings.mini_app_name;
                    document.title = settings.mini_app_name;
                }

                // Products
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('Products failed');
                const products = await res.json();
                renderProducts(products);
            } catch (e) {
                console.error('Load error:', e);
                container.innerHTML = `
                    <div class="empty">
                        <p style="margin-bottom:12px;">Unable to load content.</p>
                        <button class="btn-access" style="max-width:200px;margin:0 auto;" onclick="loadApp()">🔄 Retry</button>
                    </div>`;
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('productList');
            if (!products || products.length === 0) {
                container.innerHTML = `<div class="empty"><p>No premium products available right now.</p></div>`;
                return;
            }

            container.innerHTML = products.map(p => {
                const tags = (p.tags || 'Premium').split(',').map(t => t.trim()).filter(Boolean);
                const tagHtml = tags.map(t => {
                    const cls = t.toLowerCase().includes('vip') ? 'tag-vip' : 'tag-premium';
                    return `<span class="tag ${cls}">${t}</span>`;
                }).join('');

                let mediaHtml = '';
                if (p.media_type === 'video' && p.video_url) {
                    mediaHtml = `
                        <video src="${p.video_url}" muted autoplay loop playsinline
                               style="width:100%; height:100%; object-fit:cover; filter:blur(7px); transform:scale(1.05);">
                        </video>`;
                } else {
                    mediaHtml = `
                        <img src="${p.image_url || 'https://via.placeholder.com/600x400/1a1a25/666?text=Premium'}" 
                             alt="${p.title}" loading="lazy"
                             style="width:100%; height:100%; object-fit:cover; filter:blur(3px);">`;
                }

                return `
                <div class="product-card glow-box">
                    <div class="media-wrap">
                        ${mediaHtml}
                        <div class="overlay-lock">
                            <div class="lock-text">🔒 GET FULL ACCESS</div>
                        </div>
                        <div class="tags">${tagHtml}</div>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${p.title}</div>
                        <div class="card-desc">${p.description || ''}</div>
                        <div class="meta-row">
                            <div class="price">₹${Number(p.price).toLocaleString('en-IN')}</div>
                            <div class="validity">${p.validity || 'Lifetime'}</div>
                        </div>
                        <button class="btn-access" onclick="event.stopPropagation(); openPayment(${p.id})">
                            🚀 Get Full Access
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        async function openPayment(productId) {
            try {
                const [prodRes, qrRes] = await Promise.all([
                    fetch(`/api/product/${productId}`),
                    fetch(`/api/qr/${productId}`)
                ]);
                const product = await prodRes.json();
                const qrData = await qrRes.json();

                currentProduct = product;
                currentUpiLink = qrData.upi_link;

                document.getElementById('modalTitle').textContent = product.title;
                document.getElementById('modalSub').textContent = 'Pay & unlock instant access';
                document.getElementById('qrImage').src = `data:image/png;base64,${qrData.qr_base64}`;
                document.getElementById('billAmount').textContent = `₹${Number(product.price).toLocaleString('en-IN')}`;
                document.getElementById('billUpi').textContent = qrData.upi_id;
                document.getElementById('billDesc').textContent = qrData.bill_description || 'Premium Access';
                document.getElementById('utrInput').value = '';

                document.getElementById('paymentStep').style.display = 'block';
                document.getElementById('successStep').classList.remove('show');
                document.getElementById('paymentModal').classList.add('show');
            } catch (e) {
                alert('Failed to load payment details');
            }
        }

        function closeModal() {
            document.getElementById('paymentModal').classList.remove('show');
        }

        function openUPI() {
            if (!currentUpiLink) return;
            if (window.Telegram?.WebApp) {
                try {
                    window.Telegram.WebApp.openLink(currentUpiLink);
                } catch (e) {
                    window.location.href = currentUpiLink;
                }
            } else {
                const link = document.createElement('a');
                link.href = currentUpiLink;
                link.target = '_blank';
                link.rel = 'noopener';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
            setTimeout(() => {
                if (tg) {
                    try { tg.showAlert("Agar payment app nahi khula to QR code scan karke pay karein."); } catch(e){}
                }
            }, 1500);
        }

        async function submitUTR() {
            const utr = document.getElementById('utrInput').value.trim();
            if (!utr || utr.length < 8) {
                alert('Please enter a valid UTR / Transaction ID');
                return;
            }

            const btn = document.querySelector('.btn-submit');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const telegramUser = tg?.initDataUnsafe?.user 
                    ? `${tg.initDataUnsafe.user.first_name || ''} ${tg.initDataUnsafe.user.last_name || ''} (@${tg.initDataUnsafe.user.username || 'N/A'})`
                    : 'Web User';

                const res = await fetch('/api/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product_id: currentProduct.id,
                        utr: utr,
                        telegram_user: telegramUser
                    })
                });
                const data = await res.json();

                if (data.error) {
                    alert(data.error);
                    btn.disabled = false;
                    btn.textContent = 'Verify & Unlock';
                    return;
                }

                // Poll for approval (or show pending message)
                startStatusCheck(utr);
            } catch (e) {
                alert('Something went wrong. Try again.');
                btn.disabled = false;
                btn.textContent = 'Verify & Unlock';
            }
        }

        function startStatusCheck(utr) {
            const btn = document.querySelector('.btn-submit');
            let attempts = 0;
            const maxAttempts = 40; // ~2 min

            const interval = setInterval(async () => {
                attempts++;
                try {
                    const res = await fetch('/api/check-order-status', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ utr })
                    });
                    const data = await res.json();

                    if (data.status === 'approved') {
                        clearInterval(interval);
                        document.getElementById('paymentStep').style.display = 'none';
                        document.getElementById('successStep').classList.add('show');
                        const linkBtn = document.getElementById('groupLinkBtn');
                        linkBtn.href = data.group_link || '#';
                        if (tg) tg.HapticFeedback.notificationOccurred('success');
                    } else if (data.status === 'rejected') {
                        clearInterval(interval);
                        alert('Payment was rejected. Please contact support.');
                        btn.disabled = false;
                        btn.textContent = 'Verify & Unlock';
                    } else if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        alert('Verification is taking longer. Your UTR is submitted. Please wait for admin approval.');
                        btn.disabled = false;
                        btn.textContent = 'Verify & Unlock';
                    }
                } catch (e) {}
            }, 3000);

            // First immediate feedback
            btn.textContent = 'Waiting for approval...';
        }

        // Close modal on overlay click
        document.getElementById('paymentModal').addEventListener('click', (e) => {
            if (e.target.id === 'paymentModal') closeModal();
        });

        loadApp();
    </script>
</body>
</html>
