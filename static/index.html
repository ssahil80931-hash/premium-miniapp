<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Electric Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #05050a;
            color: #e0e0ff;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 50px;
            overflow-x: hidden;
            position: relative;
        }

        /* Mind Wire / Neural Background */
        .wires {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 150, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(120, 0, 255, 0.06) 0%, transparent 40%);
        }

        .wire-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.4), transparent);
            height: 1px;
            animation: wireMove 8s linear infinite;
            opacity: 0.5;
        }

        @keyframes wireMove {
            0% { transform: translateX(-100%); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.6; }
            100% { transform: translateX(100vw); opacity: 0; }
        }

        .header {
            text-align: center;
            padding: 25px 0 30px;
            position: relative;
            z-index: 2;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #00ff9d, #7b5cff, #00ff9d);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
            letter-spacing: 1px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .header p {
            color: #8a8aaa;
            font-size: 13px;
            margin-top: 6px;
        }

        .categories {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 13px;
            position: relative;
            z-index: 2;
        }

        .card {
            background: rgba(15, 15, 25, 0.85);
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            border: 1px solid rgba(0, 255, 170, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(0, 255, 170, 0.08),
                transparent
            );
            transform: rotate(45deg);
            animation: cardShine 6s linear infinite;
        }

        @keyframes cardShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .card:active {
            transform: scale(0.96);
            border-color: #00ff9d;
            box-shadow: 0 0 25px rgba(0, 255, 157, 0.35),
                        inset 0 0 15px rgba(0, 255, 157, 0.1);
        }

        .card .emoji {
            font-size: 30px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 6px rgba(0, 255, 170, 0.5));
        }

        .card .name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #d0d0ff;
        }

        .card .price {
            color: #00ff9d;
            font-weight: 700;
            font-size: 15px;
            text-shadow: 0 0 8px rgba(0, 255, 157, 0.5);
        }

        .claim-btn {
            display: block;
            width: 100%;
            margin-top: 26px;
            padding: 16px;
            background: linear-gradient(135deg, #00ff9d, #00c6ff);
            color: #000;
            font-size: 15px;
            font-weight: 800;
            border: none;
            border-radius: 14px;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.4);
            letter-spacing: 0.5px;
        }

        .claim-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.6);
        }

        /* Electric spark dots */
        .spark {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #00ff9d;
            border-radius: 50%;
            box-shadow: 0 0 6px #00ff9d;
            animation: sparkFly 4s linear infinite;
            opacity: 0;
        }

        @keyframes sparkFly {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="wires">
        <div class="wire-line" style="top: 15%; width: 60%; animation-delay: 0s;"></div>
        <div class="wire-line" style="top: 35%; width: 80%; animation-delay: 2s;"></div>
        <div class="wire-line" style="top: 55%; width: 50%; animation-delay: 4s;"></div>
        <div class="wire-line" style="top: 75%; width: 70%; animation-delay: 1s;"></div>
        <div class="wire-line" style="top: 90%; width: 40%; animation-delay: 3s;"></div>
    </div>

    <!-- floating sparks -->
    <div class="spark" style="left: 10%; animation-delay: 0s;"></div>
    <div class="spark" style="left: 30%; animation-delay: 1.2s;"></div>
    <div class="spark" style="left: 50%; animation-delay: 0.6s;"></div>
    <div class="spark" style="left: 70%; animation-delay: 2.1s;"></div>
    <div class="spark" style="left: 85%; animation-delay: 1.7s;"></div>

    <div class="header">
        <h1>⚡ PREMIUM STORE</h1>
        <p>Electric • Neural • Exclusive</p>
    </div>

    <div class="categories">
        <div class="card" onclick="openCategory(1)">
            <div class="emoji">📚</div>
            <div class="name">Collection 01</div>
            <div class="price">₹129</div>
        </div>
        <div class="card" onclick="openCategory(2)">
            <div class="emoji">🎨</div>
            <div class="name">Collection 02</div>
            <div class="price">₹49</div>
        </div>
        <div class="card" onclick="openCategory(3)">
            <div class="emoji">💻</div>
            <div class="name">Collection 03</div>
            <div class="price">₹70</div>
        </div>
        <div class="card" onclick="openCategory(4)">
            <div class="emoji">🎓</div>
            <div class="name">Collection 04</div>
            <div class="price">₹40</div>
        </div>
        <div class="card" onclick="openCategory(5)">
            <div class="emoji">💎</div>
            <div class="name">Collection 05</div>
            <div class="price">₹149</div>
        </div>
        <div class="card" onclick="openCategory(6)">
            <div class="emoji">🔥</div>
            <div class="name">Collection 06</div>
            <div class="price">₹199</div>
        </div>
        <div class="card" onclick="openCategory(7)">
            <div class="emoji">⚡</div>
            <div class="name">Collection 07</div>
            <div class="price">₹249</div>
        </div>
        <div class="card" onclick="openCategory(8)">
            <div class="emoji">👑</div>
            <div class="name">Collection 08</div>
            <div class="price">₹299</div>
        </div>
    </div>

    <button class="claim-btn" onclick="claimOffer()">⚡ CLAIM ELECTRIC OFFER</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor("#05050a");
        tg.setBackgroundColor("#05050a");

        function openCategory(id) {
            tg.HapticFeedback.impactOccurred("light");
            tg.showAlert("⚡ Collection " + id + "\n\nDemo + Payment soon...");
        }

        function claimOffer() {
            tg.HapticFeedback.notificationOccurred("success");
            tg.showAlert("⚡ Offer Claimed!\n\nFull access coming soon.");
        }
    </script>
</body>
</html>
